sonar.projectKey=MazzeeStudio_Asteriq
sonar.organization=mazzeestudio

# Exclude generated output, third-party packages, and the Docusaurus website.
# The website ships its own dependency tree and built HTML, none of which is
# our code; analyzing it produces ~1,300 false-positive "secrets" hits in
# node_modules plus accessibility nags in build output.
sonar.exclusions=website/**,**/bin/**,**/obj/**

# Text-rule and config-file scanners (secret detection, GitHub Actions linter,
# HTML linter) do NOT respect sonar.exclusions. Restrict them explicitly so
# they only scan our source code and tests.
sonar.text.inclusions=src/**,tests/**

# Keep duplication and coverage analysis off the website too.
sonar.cpd.exclusions=website/**
sonar.coverage.exclusions=website/**
